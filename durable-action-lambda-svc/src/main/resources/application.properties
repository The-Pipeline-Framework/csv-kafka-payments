# Cloud supplies native stores, release/function pins, signing versions and IAM.
quarkus.lambda.handler=aws-durable-action
quarkus.http.host-enabled=false
pipeline.orchestrator.process-loops-disabled=true
pipeline.orchestrator.mode=QUEUE_ASYNC
pipeline.orchestrator.coordination-host=AWS_DURABLE
pipeline.client.tls-configuration-name=
# Reuse generated pipeline beans without the resident producer TLS configuration.
quarkus.class-loading.removed-resources."org.pipelineframework.csv\:orchestrator-svc"=application.properties,\
    org/pipelineframework/csv/service/pipeline/ProcessCsvPaymentsInputRestClient.class,\
    org/pipelineframework/csv/service/pipeline/ProcessCsvPaymentsInputRestClientStep.class,\
    org/pipelineframework/csv/service/pipeline/ProcessApprovedPaymentStatusRestClient.class,\
    org/pipelineframework/csv/service/pipeline/ProcessApprovedPaymentStatusRestClientStep.class,\
    org/pipelineframework/csv/service/pipeline/ProcessUnapprovedPaymentStatusRestClient.class,\
    org/pipelineframework/csv/service/pipeline/ProcessUnapprovedPaymentStatusRestClientStep.class,\
    org/pipelineframework/csv/service/pipeline/ProcessFinalizePaymentOutputRestClient.class,\
    org/pipelineframework/csv/service/pipeline/ProcessFinalizePaymentOutputRestClientStep.class
tpf.await.kafka.reactive-messaging.enabled=false
tpf.await.sqs.poller.enabled=false
csv-payments.payment-provider.enabled=false
csv-payments.payment-provider-sqs.enabled=false
quarkus.grpc.server.use-separate-server=false
quarkus.otel.sdk.disabled=true
quarkus.index-dependency.csv-orchestrator.group-id=org.pipelineframework.csv
quarkus.index-dependency.csv-orchestrator.artifact-id=orchestrator-svc
quarkus.index-dependency.csv-orchestrator.classifier=pipeline-server

quarkus.index-dependency.csv-client.group-id=org.pipelineframework.csv
quarkus.index-dependency.csv-client.artifact-id=orchestrator-svc
quarkus.index-dependency.csv-client.classifier=orchestrator-client
