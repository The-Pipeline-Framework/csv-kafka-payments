name: Proof token handoff checks

on:
  pull_request:
    paths:
      - '.github/workflows/proof-token-handoff.yml'
      - '.github/workflows/proof-token-handoff-check.yml'
      - 'scripts/proof-token-handoff.cjs'
      - 'scripts/test-proof-token-handoff.cjs'
      - 'scripts/proof-token-handoff.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/proof-token-handoff.yml'
      - '.github/workflows/proof-token-handoff-check.yml'
      - 'scripts/proof-token-handoff.cjs'
      - 'scripts/test-proof-token-handoff.cjs'
      - 'scripts/proof-token-handoff.md'

permissions:
  contents: read

jobs:
  crypto-and-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # Unprivileged synthetic tests only: never references any secret or OAuth endpoint.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify synthetic crypto, identity, filesystem and workflow controls
        run: |
          node --check scripts/proof-token-handoff.cjs
          node --test scripts/test-proof-token-handoff.cjs
