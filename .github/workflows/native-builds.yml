name: CSV native builds

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        service:
          - orchestrator-svc
          - input-csv-file-processing-svc
          - payments-processing-svc
          - payment-status-svc
    env:
      MAVEN_OPTS: -Xmx2g -Xms512m

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository

      - name: Build native executable from released dependencies
        shell: bash
        run: |
          set -euo pipefail
          native_args='--enable-preview'
          if [[ '${{ matrix.service }}' == input-csv-file-processing-svc ]]; then
            native_args='--enable-preview,--initialize-at-run-time=org.apache.commons.logging.impl.Log4jApiLogFactory'
          fi
          ./mvnw -B --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository" \
            -f pom.xml -pl '${{ matrix.service }}' -am -DskipTests \
            -Dquarkus.container-image.build=false -Dquarkus.native.enabled=true \
            -Dquarkus.native.container-build=true \
            "-Dquarkus.native.additional-build-args=$native_args" package
          test -f '${{ matrix.service }}/target/'*-runner

      - name: Upload native executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: csv-${{ matrix.service }}-native
          path: ${{ matrix.service }}/target/*-runner
          retention-days: 7
          if-no-files-found: error
