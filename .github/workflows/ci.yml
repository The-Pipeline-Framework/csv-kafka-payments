name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository

      - name: Check observability proof launcher
        run: python3 -m unittest discover -s self-host/container -p test_observability_runner.py

      - name: Check HA failure diagnostics
        run: python3 -m unittest -v self-host/container/test_ha_diagnostics.py self-host/container/test_ha_scale_policy.py

      - name: Check application dependency contract
        run: python3 scripts/test-application-dependencies.py

      - name: Check framework provenance version resolution
        run: python3 scripts/test-framework-version.py

      - name: Compile and run unit tests
        run: ./mvnw -B install -Dquarkus.container-image.build=false --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"

      - name: Check release build lifecycle
        run: python3 scripts/test-release-build.py

      - name: Check release step identities
        run: python3 scripts/test-release-step-identities.py

      - name: Check release verifier
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'

  pilot-ingress:
    name: Verify FUNCTION upload, workers and S3 result
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIPELINE_CONFIG: ${{ github.workspace }}/config/pipeline.pilot.yaml
      PIPELINE_TRANSPORT: REST
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Build and prove upload, native handlers, payment workers and S3 results
        env:
          MAVEN_ARGS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository
        run: bash self-host/pilot/build-and-prove.sh
      - name: Prove IAM signing through cold generated clients and TLS
        run: bash self-host/pilot/build-and-prove-iam.sh
      - name: Retain IAM transport evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: csv-iam-signing-proof-${{ github.sha }}
          path: |
            target/iam-signing-proof/result*.json
            target/iam-signing-proof/client*.log
            target/iam-signing-unbound-proof/result*.json
            target/iam-signing-unbound-proof/client*.log
            target/worker-binding-proof/result*.json
            target/worker-binding-proof/*-function.log
            target/worker-binding-unbound-proof/result*.json
            target/worker-binding-unbound-proof/*-function.log
            target/iam-package-restoration.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain labelled fixture-bound package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: csv-iam-fixture-bound-evidence-${{ github.sha }}
          path: |
            target/iam-fixture-bound-packages/*/*-evidence.json
            target/iam-package-restoration.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain local proof diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: csv-worker-s3-proof-${{ github.sha }}
          path: |
            target/pilot-local-proof/*.json
            target/pilot-local-proof/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Retain the review package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: csv-function-ingress-${{ github.sha }}
          path: |
            ingress-lambda-svc/target/function.zip
            worker-lambda-svc/target/function.zip
            provider-lambda-svc/target/function.zip
            durable-action-lambda-svc/target/function.zip
            worker-lambda-svc/target/surefire-reports/TEST-*.xml
            provider-lambda-svc/target/surefire-reports/TEST-*.xml
            ingress-lambda-svc/target/surefire-reports/TEST-*.xml
            target/pilot-local-proof/worker-variant/pipeline/
          if-no-files-found: error
          retention-days: 7

  durable-action:
    name: Verify native Durable action package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIPELINE_CONFIG: ${{ github.workspace }}/config/pipeline.pilot.yaml
      PIPELINE_TRANSPORT: REST
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Generate the existing native Durable input seam
        run: >-
          ./build-pipeline-runtime.sh
          -pl common,payments-processing-svc,pipeline-runtime-svc,orchestrator-svc
          -DskipTests -DskipITs=true
          -Dtpf.build.platform=FUNCTION -Dtpf.build.coordination.host=AWS_DURABLE
          -Dtpf.build.lambda.scope=compile -Dquarkus.container-image.build=false
          -Dtpf.await.kafka.reactive-messaging.enabled=false
          -Dcsv-payments.payment-provider.enabled=false
          -Dcsv-payments.payment-provider-sqs.enabled=true
      - name: Verify and package the published native action handler
        run: >-
          ./mvnw -B -ntp -f durable-action-lambda-svc/pom.xml clean verify
          -Dquarkus.container-image.build=false
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
      - name: Retain the native action review package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: csv-durable-action-${{ github.sha }}
          path: |
            durable-action-lambda-svc/target/function.zip
            durable-action-lambda-svc/target/surefire-reports/TEST-*.xml
            durable-action-lambda-svc/target/classes/META-INF/pipeline/
          if-no-files-found: error
          retention-days: 7
