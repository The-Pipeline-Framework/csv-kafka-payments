# Cloud must restrict the Function URL resource policy to the pinned worker caller.
quarkus.lambda-http.enable-security=true
quarkus.http.auth.permission.worker.paths=/*
quarkus.http.auth.permission.worker.policy=authenticated
quarkus.http.insecure-requests=enabled
quarkus.http.ssl.certificate.key-store-file=
quarkus.http.ssl.certificate.trust-store-file=
pipeline.client.tls-configuration-name=
# Reuse the grouped runtime classes, not its resident socket/Kafka deployment defaults.
quarkus.class-loading.removed-resources."org.pipelineframework.csv\:pipeline-runtime-svc"=application.properties
pipeline.module.pipeline-runtime-svc.steps=process-csv-payments-input,await-payment-provider,process-approved-payment-status,process-unapproved-payment-status,process-finalize-payment-output
# Lambda HTTP terminates TLS; the ordinary socket-host validator remains intact.
quarkus.arc.exclude-types=org.pipelineframework.csv.pipelineruntime.config.PipelineRuntimeSecurityConfigValidator,org.pipelineframework.csv.service.PaymentProviderSqsAwaitMock,org.pipelineframework.csv.service.PaymentProviderKafkaAwaitMock,org.pipelineframework.objectingest.ObjectIngestBootstrap
pipeline.orchestrator.process-loops-disabled=true
pipeline.orchestrator.control-plane.enabled=false
pipeline.orchestrator.admin.enabled=false
pipeline.orchestrator.mode=QUEUE_ASYNC
tpf.await.kafka.reactive-messaging.enabled=false
tpf.await.sqs.poller.enabled=false
quarkus.grpc.server.use-separate-server=false
quarkus.grpc.server.plain-text=true
quarkus.otel.sdk.disabled=true
quarkus.index-dependency.csv-runtime.group-id=org.pipelineframework.csv
quarkus.index-dependency.csv-runtime.artifact-id=pipeline-runtime-svc
quarkus.index-dependency.csv-runtime.classifier=pipeline-server
