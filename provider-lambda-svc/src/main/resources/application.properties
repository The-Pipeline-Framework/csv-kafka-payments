# The SQS event source mapping owns request receipt and acknowledgement in this package.
quarkus.lambda.handler=csv-provider
quarkus.http.host-enabled=false
quarkus.http.insecure-requests=enabled
quarkus.http.ssl.certificate.key-store-file=
quarkus.grpc.server.use-separate-server=false
quarkus.otel.sdk.disabled=true
# The processing dependency contains resident self-host adapters; neither is a Lambda bean.
quarkus.arc.exclude-types=org.pipelineframework.csv.service.PaymentProviderSqsAwaitMock,org.pipelineframework.csv.service.PaymentProviderKafkaAwaitMock
mp.messaging.incoming.csv-payment-provider-requests.enabled=false
mp.messaging.outgoing.csv-payment-provider-results.enabled=false
