# Private ingress only. Cloud owns IAM, functions, keys and resource bindings.
csv.pilot.enabled=false
quarkus.lambda-http.enable-security=true
# REST upload operations do not start the separate resident object-ingest runner.
quarkus.arc.exclude-types=org.pipelineframework.objectingest.ObjectIngestBootstrap
pipeline.orchestrator.process-loops-disabled=true
pipeline.orchestrator.mode=QUEUE_ASYNC
# Resume signing is supplied by an exact SSM generation in Cloud; ordinary local
# proof may supply PIPELINE_ORCHESTRATOR_RESUME_TOKEN_SECRET directly. No default key.
pipeline.client.tls-configuration-name=
tpf.await.kafka.reactive-messaging.enabled=false
tpf.await.sqs.poller.enabled=false
csv-payments.payment-provider.enabled=false
csv-payments.payment-provider-sqs.enabled=false
quarkus.grpc.server.use-separate-server=false
quarkus.grpc.server.plain-text=true
quarkus.otel.sdk.disabled=true
# Reuse the producer's generated payload endpoints and native pipeline CDI metadata.
quarkus.index-dependency.csv-orchestrator.group-id=org.pipelineframework.csv
quarkus.index-dependency.csv-orchestrator.artifact-id=orchestrator-svc
quarkus.index-dependency.csv-orchestrator.classifier=pipeline-server


# Reuse the worker Lambda pattern: producer classes and Compiled Truth are needed,
# but its resident HTTP server and workstation TLS files are not Lambda settings.
quarkus.class-loading.removed-resources."org.pipelineframework.csv\:orchestrator-svc"=application.properties
quarkus.http.insecure-requests=enabled
quarkus.http.ssl.certificate.key-store-file=
quarkus.http.ssl.certificate.trust-store-file=
